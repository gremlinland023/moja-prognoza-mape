name: Provera upozorenja
on: { push: { branches: [provera-upozorenja] } }
jobs:
  p:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - run: |
          mkdir o
          for u in \
            "https://geocoding-api.open-meteo.com/v1/search?count=10&language=sr&format=json&name=Ne" \
            "https://geocoding-api.open-meteo.com/v1/search?count=10&language=sr&format=json&name=Neg" \
            "https://geocoding-api.open-meteo.com/v1/search?count=10&language=sr&format=json&name=Nego" \
            "https://geocoding-api.open-meteo.com/v1/search?count=10&language=sr&format=json&name=Zre" \
            "https://geocoding-api.open-meteo.com/v1/search?count=10&language=sr&format=json&name=Nov" \
            "https://geocoding-api.open-meteo.com/v1/search?count=10&language=sr&format=json&name=Bec" \
            "https://geocoding-api.open-meteo.com/v1/search?count=10&language=sr&format=json&name=Neg&countryCode=RS" \
            "https://geocoding-api.open-meteo.com/v1/search?count=10&language=sr&format=json&name=Zr" \
            "https://geocoding-api.open-meteo.com/v1/search?count=10&language=sr&format=json&name=Kik" \
            ; do
            n=$(echo "$u" | md5sum | cut -c1-6)
            code=$(curl -sL -m 30 -A "Mozilla/5.0" -o o/$n.txt -w "%{http_code} %{content_type} %{size_download}" "$u")
            echo "$u -> $code -> fajl $n.txt" >> o/rezime.txt
          done
          cat o/rezime.txt
          for f in o/*.txt; do echo "== $f"; jq -c '[.results[]? | [.name, .country_code, .admin1]]' "$f" 2>/dev/null; done > o/imena.txt; cat o/imena.txt
      - run: |
          cd o && git init -q && git checkout -q -b provera-rezultat
          git config user.name robot && git config user.email robot@users.noreply.github.com
          git add -A && git commit -qm r && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" provera-rezultat
